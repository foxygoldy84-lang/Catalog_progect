[project]
name = "catalog-progect"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
requires-python = ">=3.13"
dependencies = [
    "django (>=6.1,<7.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "isort (>=9.0.1,<10.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "flake8 (>=7.3.0,<8.0.0)"
]

[tool.poe.tasks]
format-black = "black ."
format-isort = "isort ."
lint-flake8  = "flake8 ."
lint-mypy    = "mypy ."

# Объединяем все четыре проверки в одну команду "all"
all = ["format-black", "format-isort", "lint-flake8", "lint-mypy"]
