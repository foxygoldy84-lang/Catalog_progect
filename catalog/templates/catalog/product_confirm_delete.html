{% extends 'catalog/base.html' %}

{% block title %}Удаление товара{% endblock %}

{% block content %}
<div class="container" style="max-width: 640px;">
    <div class="card shadow-sm bg-white p-4">
        <h2 class="mb-3">Удалить товар?</h2>
        <p>
            Вы собираетесь удалить товар «{{ object.name }}».
            Это действие нельзя отменить.
        </p>

        <form method="post">
            {% csrf_token %}
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-danger">Да, удалить</button>
                <a href="{% url 'catalog:product_detail' object.pk %}" class="btn btn-secondary">Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
