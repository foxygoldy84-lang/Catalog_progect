<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная страница</title>
    <!-- Подключаем Bootstrap 5 -->
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Верхнее меню (Навигация) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Каталог товаров</a>
            <div class="navbar-nav">
                <a class="nav-link active" href="/">Главная</a>
                <a class="nav-link" href="/contacts/">Контакты</a>
            </div>
        </div>
    </nav>

    <!-- Основной блок на странице -->
    <main class="container">
        <div class="p-5 mb-4 bg-white rounded-3 shadow-sm text-center">
            <h1 class="display-5 fw-bold text-dark">Добро пожаловать в Каталог!</h1>
            <p class="lead text-muted">Это домашняя страница нашего нового веб-приложения на Django.</p>
            <hr class="my-4">
            <p>Вы можете перейти в раздел контактов, чтобы отправить нам сообщение.</p>
            <a class="btn btn-primary btn-lg" href="/contacts/" role="button">Перейти к контактам</a>
        </div>
    </main>

</body>
</html>
