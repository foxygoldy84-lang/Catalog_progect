{% extends "catalog/base.html" %}
{% block title %}Удаление статьи{% endblock %}
{% block content %}
    <div class="container" style="max-width: 640px;">
        <div class="card shadow-sm bg-white p-4">
            <h2 class="mb-3">Удалить статью?</h2>
            <p>
                Вы собираетесь удалить статью «{{ object.title }}».
                Это действие нельзя отменить.
            </p>

            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Да, удалить</button>
                <a href="{% url 'blog:blogpost_detail' object.pk %}" class="btn btn-secondary">Отмена</a>
            </form>
        </div>
    </div>
{% endblock %}
